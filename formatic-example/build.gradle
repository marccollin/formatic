plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'application'
}

description = 'Formatic Examples and Demos'

dependencies {
    // Dependencies for all modules
    implementation project(':formatic-core')
    implementation project(':formatic-spring-boot-starter-thymeleaf')
    implementation project(':formatic-render-jte')
    implementation project(':formatic-render-pebble')

    // Spring Boot for Spring examples
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.13'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    //The compiler for this module must execute the core processor.
    annotationProcessor project(':formatic-core')

    annotationProcessor 'com.palantir.javapoet:javapoet:0.9.0'
}

// Configuration used for testing
test {
    useJUnitPlatform()

    // Test profile configuration
    systemProperty 'spring.profiles.active', 'test'

    // Increase memory for integration tests
    maxHeapSize = '512m'
}

processResources {
    // Only extend specific configuration files
    filesMatching(['**/*.properties', '**/*.yml', '**/*.yaml']) {
        expand(project.properties)
    }
}

bootBuildImage {
    imageName = "formatic-example:latest" // Replace with your desired image name
}