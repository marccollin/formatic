<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="select-field(field)" th:remove="tag"
     th:with="fieldErrors=${#lists.isEmpty(#fields.errors()) ? {} : #fields.errors(field.name)},
              fieldInvalid=${not #lists.isEmpty(fieldErrors)},
              fieldHelp=${not #strings.isEmpty(field.helpText)},
              fieldDescription=${(fieldHelp ? field.name + '-help' : '') + (fieldInvalid ? (fieldHelp ? ' ' : '') + field.name + '-errors' : '')}">

    <div class="mb-4">

        <label class="block text-sm font-medium text-gray-700 mb-2" th:classappend="${field.required} ? 'required' : ''"
               th:for="${field.name}"
               th:text="${field.label}"></label>


        <select class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                th:attrappend="class=${fieldInvalid ? ' !border-red-500 focus:!border-red-500 focus:!ring-red-500' : ''}"
                th:aria-invalid="${fieldInvalid ? 'true' : null}"
                th:aria-describedby="${#strings.isEmpty(fieldDescription) ? null : fieldDescription}"
                th:classappend="${field.cssClass}"
                th:field="*{__${field.name}__}"
                th:multiple="${field.multiple}"
                th:disabled="${field.disabled}"
                th:required="${field.required}">
            <option th:unless="${field.required}" value="">Sélectionnez...</option>
            <option th:disabled="${option.disabled}"
                    th:each="option : ${field.options}"
                    th:text="${option.label}"
                    th:value="${option.value}"></option>
        </select>
        <small class="help-text" th:id="${field.name + '-help'}" th:if="${fieldHelp}" th:text="${field.helpText}"></small>
        <div class="mt-1 text-sm text-red-600" th:if="${fieldInvalid}"
             th:id="${field.name + '-errors'}" role="alert">
            <div th:each="error : ${fieldErrors}" th:text="${error}"></div>
        </div>

    </div>
</div>
</html>
