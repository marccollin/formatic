<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="radio-field(field)" th:remove="tag"
     th:with="fieldErrors=${#lists.isEmpty(#fields.errors()) ? {} : #fields.errors(field.name)},
              fieldInvalid=${not #lists.isEmpty(fieldErrors)},
              fieldHelp=${not #strings.isEmpty(field.helpText)},
              fieldDescription=${(fieldHelp ? field.name + '-help' : '') + (fieldInvalid ? (fieldHelp ? ' ' : '') + field.name + '-errors' : '')}">

    <fieldset class="row mb-3">

        <legend class="col-form-label col-sm-2 pt-0"
                th:classappend="${field.required} ? 'required' : ''"
                th:text="${field.label}"></legend>

        <div class="col-sm-10">
            <div class="form-check form-check-inline" th:each="option : ${field.options}">
                <input class="form-check-input"
                       th:classappend="${field.cssClass}"
                       th:attrappend="class=${fieldInvalid ? ' is-invalid' : ''}"
                       th:aria-invalid="${fieldInvalid ? 'true' : null}"
                       th:aria-describedby="${#strings.isEmpty(fieldDescription) ? null : fieldDescription}"
                       th:checked="${option.selected}"
                       th:disabled="${field.disabled or option.disabled}"
                       th:field="*{__${field.name}__}"
                       th:id="${field.name + '_' + option.value}"
                       th:name="${field.name}"
                       th:required="${field.required}"
                       th:value="${option.value}"
                       type="radio"/>

                <label class="form-check-label"
                       th:classappend="${field.disabled or option.disabled} ? 'disabled' : ''"
                       th:for="${field.name + '_' + option.value}"
                       th:text="${option.label}"></label>
            </div>
        </div>

        <!-- Message d'aide -->
        <small class="help-text radio-help"
               th:id="${field.name + '-help'}" th:if="${fieldHelp}"
               th:text="${field.helpText}"></small>
        <div class="invalid-feedback d-block" th:if="${fieldInvalid}"
             th:id="${field.name + '-errors'}" role="alert">
            <div th:each="error : ${fieldErrors}" th:text="${error}"></div>
        </div>
    </fieldset>
</div>
</html>
