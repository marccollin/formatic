<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="checkbox-field(field)" th:remove="tag"
     th:with="fieldErrors=${#lists.isEmpty(#fields.errors()) ? {} : #fields.errors(field.name)},
              fieldInvalid=${not #lists.isEmpty(fieldErrors)},
              fieldHelp=${not #strings.isEmpty(field.helpText)},
              fieldDescription=${(fieldHelp ? field.name + '-help' : '') + (fieldInvalid ? (fieldHelp ? ' ' : '') + field.name + '-errors' : '')}">

    <fieldset class="field" th:classappend="${field.outerCssClass}">

        <th:block th:if="${field.multiple}">
            <legend class="label"
                    th:classappend="${field.required} ? 'required' : ''"
                    th:text="${field.label} "></legend>


            <div class="field" th:each="option : ${field.options}">
                <label class="checkbox">
                    <input
                       th:attrappend="class=${fieldInvalid ? ' is-danger' : ''}"
                       th:aria-invalid="${fieldInvalid ? 'true' : null}"
                       th:aria-describedby="${#strings.isEmpty(fieldDescription) ? null : fieldDescription}"
                       th:classappend="${field.cssClass}"
                       th:field="*{__${field.name}__}"
                       th:disabled="${field.disabled or option.disabled}"
                       th:id="${field.name + '_' + option.value}"
                       th:required="${field.required}"
                       th:value="${option.value}"
                       type="checkbox"/>
                    <span th:text="${option.label}"></span>
                </label>
            </div>

        </th:block>

        <!-- Checkbox simple (boolean) -->
        <th:block th:unless="${field.multiple}">

            <div class="field">
                <label class="checkbox" th:classappend="${field.required} ? 'required' : ''">
                    <input
                       th:attrappend="class=${fieldInvalid ? ' is-danger' : ''}"
                       th:aria-invalid="${fieldInvalid ? 'true' : null}"
                       th:aria-describedby="${#strings.isEmpty(fieldDescription) ? null : fieldDescription}"
                       th:field="*{__${field.name}__}"
                       th:classappend="${field.cssClass}"
                       th:id="${field.name}"
                       th:disabled="${field.disabled}"
                       th:required="${field.required}"
                       value="true"
                       type="checkbox"/>
                    <span th:text="${field.label}"></span>
                </label>
            </div>
        </th:block>
        <small class="help" th:id="${field.name + '-help'}" th:if="${fieldHelp}" th:text="${field.helpText}"></small>
        <div class="help is-danger" th:if="${fieldInvalid}"
             th:id="${field.name + '-errors'}" role="alert">
            <div th:each="error : ${fieldErrors}" th:text="${error}"></div>
        </div>
    </fieldset>
</div>
</html>
